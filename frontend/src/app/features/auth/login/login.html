<app-auth-card
  title="¡Hola de nuevo!"
  description="Ingresa tus credenciales para acceder al panel."
>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

    <!-- Email Field -->
    <div class="space-y-2">
      <label for="email" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700">
        Correo Electrónico
      </label>
      <div class="relative">
        <lucide-icon name="mail" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nombre@ejemplo.com"
          class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-all"
        />
      </div>
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <p class="text-xs text-red-500 font-medium ml-1">Ingresa un correo válido.</p>
      }
    </div>

    <!-- Password Field -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label for="password" class="text-sm font-medium leading-none text-slate-700">Contraseña</label>
        <a href="#" class="text-xs text-blue-600 hover:text-blue-800 hover:underline">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="relative">
        <lucide-icon name="lock" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm ring-offset-white placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-all"
        />
      </div>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading()"
      class="inline-flex items-center justify-center whitespace-nowrap rounded-lg text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-600 text-white hover:bg-blue-700 h-10 px-4 py-2 w-full shadow-sm hover:shadow-md"
    >
      @if (isLoading()) {
        <lucide-icon name="loader-2" class="mr-2 h-4 w-4 animate-spin"></lucide-icon>
        Iniciando sesión...
      } @else {
        Acceder
      }
    </button>
  </form>

  <div class="mt-6 text-center text-sm text-slate-500">
    ¿Aún no tienes cuenta?
    <a routerLink="/register" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline cursor-pointer transition-colors">
      Regístrate aquí
    </a>
  </div>
</app-auth-card>
