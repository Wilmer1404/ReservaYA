<app-auth-card
  title="Iniciar Sesión"
  description="Ingresa a tu cuenta para gestionar tus reservas."
>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div class="space-y-2">
      <label for="email" class="text-sm font-medium leading-none">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="m@example.com"
        class="flex h-9 w-full rounded-md border border-slate-300 bg-transparent px-3 py-1 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>
    <div class="space-y-2">
      <label for="password" class="text-sm font-medium leading-none">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="flex h-9 w-full rounded-md border border-slate-300 bg-transparent px-3 py-1 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600"
      />
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading()"
      class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium h-9 px-4 py-2 w-full bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-50 disabled:pointer-events-none transition-colors"
    >
      @if (isLoading()) {
        Cargando...
      } @else {
        Iniciar Sesión
      }
    </button>
  </form>

  <div class="mt-4 text-center text-sm text-slate-600">
    ¿No tienes cuenta?
    <a routerLink="/register" class="text-blue-600 hover:underline font-medium">Regístrate</a>
  </div>
</app-auth-card>
