<app-auth-card
  title="Crea tu cuenta"
  description="Registra tu institución y comienza a gestionar espacios."
>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

    <!-- Nombre Institución -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none text-slate-700">Nombre de la Institución</label>
      <div class="relative">
        <lucide-icon name="building-2" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
        <input
          type="text"
          formControlName="institutionName"
          class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
          placeholder="Ej: Universidad Nacional"
        />
      </div>
    </div>

    <!-- Grid de 2 columnas -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Tipo -->
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none text-slate-700">Tipo</label>
        <div class="relative">
          <select
            formControlName="institutionType"
            class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 cursor-pointer appearance-none"
          >
            <option value="university">Universidad</option>
            <option value="school">Colegio</option>
            <option value="sports">Centro Deportivo</option>
            <option value="library">Biblioteca</option>
            <option value="company">Empresa</option>
            <option value="other">Otro</option>
          </select>
          <!-- Flechita custom para el select -->
          <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
            <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <!-- Dominio -->
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none text-slate-700">Dominio (Opcional)</label>
        <div class="relative">
          <lucide-icon name="mail" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
          <input
            type="text"
            formControlName="institutionEmailDomain"
            class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
            placeholder="Ej: uni.edu.pe"
          />
        </div>
      </div>
    </div>

    <!-- Separador sutil -->
    <div class="relative py-2">
      <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200"></span></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-500">Datos del Administrador</span></div>
    </div>

    <!-- Admin Name -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none text-slate-700">Nombre Completo</label>
      <div class="relative">
        <lucide-icon name="user" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
        <input
          type="text"
          formControlName="adminName"
          class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
          placeholder="Juan Pérez"
        />
      </div>
    </div>

    <!-- Admin Email -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none text-slate-700">Correo Corporativo</label>
      <div class="relative">
        <lucide-icon name="mail" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
        <input
          type="email"
          formControlName="adminEmail"
          class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
          placeholder="admin@institucion.com"
        />
      </div>
    </div>

    <!-- Contraseñas -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none text-slate-700">Contraseña</label>
        <div class="relative">
          <lucide-icon name="lock" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
          <input
            type="password"
            formControlName="adminPassword"
            class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
            placeholder="••••••••"
          />
        </div>
      </div>
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none text-slate-700">Confirmar</label>
        <div class="relative">
          <lucide-icon name="lock" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></lucide-icon>
          <input
            type="password"
            formControlName="confirmPassword"
            class="flex h-10 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-10 text-sm placeholder:text-slate-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
            placeholder="••••••••"
          />
        </div>
      </div>
    </div>

    <!-- Error de coincidencia de contraseña -->
    @if (registerForm.hasError('mismatch') && (registerForm.get('confirmPassword')?.touched || registerForm.get('adminPassword')?.touched)) {
      <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-xs flex items-center gap-2 animate-in fade-in slide-in-from-top-1">
        <lucide-icon name="alert-circle" class="w-4 h-4"></lucide-icon>
        Las contraseñas no coinciden.
      </div>
    }

    <!-- Submit -->
    <button
      type="submit"
      [disabled]="registerForm.invalid || isLoading()"
      class="mt-4 inline-flex items-center justify-center whitespace-nowrap rounded-lg text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-blue-600 text-white hover:bg-blue-700 h-10 px-4 py-2 w-full shadow-md hover:shadow-lg"
    >
      @if (isLoading()) {
        <lucide-icon name="loader-2" class="w-4 h-4 mr-2 animate-spin"></lucide-icon>
        Creando cuenta...
      } @else {
        Registrar Institución
      }
    </button>
  </form>

  <div class="mt-6 text-center text-sm text-slate-500">
    ¿Ya tienes cuenta?
    <a routerLink="/login" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline cursor-pointer transition-colors">
      Inicia sesión
    </a>
  </div>
</app-auth-card>
