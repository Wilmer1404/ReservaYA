spring:
  datasource:
    url: jdbc:h2:mem:reservaya;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: "http://localhost:5173,https://app.reservaya.com"
